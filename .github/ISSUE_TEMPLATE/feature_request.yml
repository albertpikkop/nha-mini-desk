name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to improve?
      description: Keep it practical and user-focused.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Who would this help?
      description: Example user, classroom use, language group, or workflow.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: What should the tool do?
