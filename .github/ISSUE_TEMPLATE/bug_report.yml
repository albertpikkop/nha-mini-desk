name: Bug report
description: Report something that is broken or confusing
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug or confusing behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Spanish
        - English
        - Hindi
        - Punjabi
        - Not language-specific
  - type: textarea
    id: device
    attributes:
      label: Device and browser
      placeholder: "Example: iPhone Safari, Android Chrome, Mac Chrome"
